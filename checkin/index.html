<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<link rel="stylesheet" href="/theme.css">
<script src="/site-config.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/shared/ops.css">
<style>
.summary { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--t-radius); padding: 10px 14px; min-width: 8.5rem; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--muted); }
.stat.all { border-color: var(--done); }
.search { width: 100%; font-size: 1.15rem; padding: 12px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); padding: 5px 12px; border-radius: var(--t-radius-sm); cursor: pointer; font-weight: 700; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--t-highlight); color: var(--t-highlight-ink); border-color: var(--t-highlight); }
.teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--t-radius); padding: 14px; display: grid; gap: 10px; align-content: start; }
.team.in { border-color: var(--done); box-shadow: inset 4px 0 0 var(--done); }
.team.no { opacity: .7; }
.team h3 { margin: 0; font-size: 1.15rem; line-height: 1.25; overflow-wrap: anywhere; }
.team .head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.team .sub { font-size: .88rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.players { display: flex; gap: 6px; flex-wrap: wrap; }
.player { border: 1px solid var(--line); background: var(--bg); border-radius: var(--t-radius-sm); padding: 5px 11px; cursor: pointer; font-size: .92rem; }
.player.here { background: var(--done-bg); border-color: var(--done); color: var(--done); font-weight: 700; }
.player.here::before { content: "✓ "; }
.team .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.team .acts .btn.good { flex: 1; justify-content: center; padding: 10px 14px; font-size: 1rem; }
.team .notes { font-size: .88rem; white-space: pre-wrap; }
.team.editing { grid-column: 1 / -1; }
.editor { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.editor .wide { grid-column: 1 / -1; }
.editor .acts .danger { margin-left: auto; }
.plist { display: grid; gap: 6px; }
.plist .prow { display: flex; gap: 6px; }
.plist .prow input { flex: 1; }
.mapgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.prevtable td { font-size: .85rem; }
/* Front desk */
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.people li:first-child { border-top: 0; }
.people li.in { background: color-mix(in srgb, var(--done) 8%, transparent); }
.people .who { min-width: 0; }
.people .who b { font-size: 1.08rem; overflow-wrap: anywhere; }
.people .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; font-size: .88rem; color: var(--muted); }
.people .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.people .btn.good { padding: 9px 16px; font-size: 1rem; }
.pill.comp { background: color-mix(in srgb, var(--t-accent) 16%, transparent); color: var(--t-accent); }
.pill.spec { background: color-mix(in srgb, var(--t-accent-3) 16%, transparent); color: var(--t-accent-3); }
.people li.editing { display: block; }
@media (max-width: 520px) { .people li { grid-template-columns: 1fr; } .people .acts { justify-content: flex-start; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1 id="title">Check-in</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-tab="desk">Front desk</button>
      <button data-tab="checkin">T.O Desk</button>
      <button data-tab="switch">Switch 2 Check-in/Out</button>
      <button data-tab="setup">Import &amp; setup</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shared/ops.js"></script>
<script src="/nav.js"></script>
<script src="/checkin/app.js"></script>
</body>
</html>
