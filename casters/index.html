<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commentator info</title>
<link rel="stylesheet" href="/theme.css">
<script src="/site-config.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/shared/ops.css">
<style>
body { font-size: 17px; }
.matchbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.matchbar .what { font-weight: 800; font-size: 1.05rem; }
.matchbar .score { font: 800 1.6rem/1 var(--t-font); color: var(--t-highlight); font-variant-numeric: tabular-nums; }
.follow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.follow select { min-width: 12rem; }
.duo { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 760px) { .duo { grid-template-columns: 1fr 1fr; } }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--t-radius); overflow: hidden; display: grid; }
.tcard .head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: var(--t-bg-deep); }
.tcard .side { font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tcard h2 { margin: 2px 0 0; font: 800 clamp(1.4rem, 3.4vw, 2rem)/1.1 var(--t-font); text-transform: uppercase; letter-spacing: .02em; color: var(--t-highlight); overflow-wrap: anywhere; }
.tcard .facts { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
.fact { background: var(--bg); border: 1px solid var(--line); border-radius: var(--t-radius-sm); padding: 6px 10px; min-width: 0; }
.fact span { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fact b { font-size: 1.15rem; overflow-wrap: anywhere; }
.roster { list-style: none; margin: 0; padding: 8px 16px 4px; display: grid; gap: 0; }
.roster li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 3px; }
.roster li:first-child { border-top: 0; }
.roster .pn { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.roster .pn b { font-size: 1.2rem; overflow-wrap: anywhere; }
.roster .pron { font-size: .8rem; font-weight: 700; color: var(--t-accent-3); border: 1px solid color-mix(in srgb, var(--t-accent-3) 40%, transparent); border-radius: var(--t-radius-sm); padding: 0 7px; }
.roster .num { color: var(--muted); font-weight: 700; font-size: .85rem; min-width: 1.4em; }
.roster .kv { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--t-ink-2); font-size: .98rem; padding-left: 2em; }
.roster .kv span { color: var(--muted); }
.fun { margin: 4px 16px 16px; padding: 12px 14px; border-radius: var(--t-radius-sm); background: color-mix(in srgb, var(--t-highlight) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--t-highlight) 35%, transparent); }
.fun span { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--t-highlight); margin-bottom: 4px; }
.fun p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.missing { padding: 14px 16px; color: var(--muted); }
.teamlist { list-style: none; margin: 0; padding: 0; }
.teamlist li { border-top: 1px solid var(--line); }
.teamlist li:first-child { border-top: 0; }
.teamlist button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 16px; }
.teamlist button:hover { background: var(--bg); }
.teamlist button b { overflow-wrap: anywhere; }
.mapgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.prevtable td { font-size: .85rem; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row"><h1 id="title">Commentator info</h1></div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-tab="live">On stream</button>
      <button data-tab="teams">All teams</button>
      <button data-tab="import" hidden>Import</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shared/ops.js"></script>
<script src="/nav.js"></script>
<script src="/casters/app.js"></script>
</body>
</html>
