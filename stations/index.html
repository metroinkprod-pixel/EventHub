<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metro Gaming Board</title>
    <link rel="stylesheet" href="/theme.css" />
    <script src="/site-config.js"></script>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/stations/style.css" />
    <script>
      // TV mode: open /stations/?tv to hide the hub menu bar on the big screen.
      if (new URLSearchParams(location.search).has('tv')) {
        document.documentElement.dataset.hubnav = 'off';
      }
    </script>
  </head>
  <body>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img src="/stations/assets/BigDapple.png" class="event-logo" alt="BigDapple Logo" />
        <div class="event-info">
          <span class="event-name">BIG DAPPLE 11 TEAM STATIONS</span>
        </div>
      </div>
      <div class="clock">12:34 PM</div>
    </header>

<!-- MATCHES -->
<main class="matches">


</main>

    <!-- STREAM FOOTER -->
    <footer class="stream-footer">
    <img src="/stations/assets/GG_logo_white(1).png" class="gengame-logo" alt="GenGame Logo" />
    <div class="twitch-badge">LIVE</div>
    <span class="twitch-link">twitch.tv/GenGame</span>
    <span class="divider">|</span>
    <span class="on-stream">ON STREAM: Team Alpha vs Team Beta — Winners Semis · Station 1</span>
      <a class="bracket-link" id="bracketLink" target="_blank" rel="noopener" hidden></a>
    </footer>
    <script>
      // Bracket link in the footer, from "startgg" in site-config.js.
      // On the TV (?tv) it shows the address so people can type it; elsewhere a small "Bracket" button.
      (function () {
        var url = (window.HUB && HUB.links && HUB.links.startgg) || "", a = document.getElementById("bracketLink");
        if (!url) return;
        a.href = url;
        a.textContent = new URLSearchParams(location.search).has("tv")
          ? "Bracket: " + url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")
          : "Bracket";
        a.hidden = false;
      })();
    </script>
    <script src="/stations/script.js"></script>
    <script src="/nav.js"></script>
  </body>
</html>
