<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickup games</title>
<link rel="stylesheet" href="/theme.css">
<script src="/site-config.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/shared/ops.css">
<style>
.lead { margin: 0; color: var(--muted); font-size: .92rem; }
.me { display: grid; gap: 12px; }
.me .big { font: 800 2.4rem/1 var(--t-font); color: var(--t-highlight); }
.me h2 { margin: 0; font-size: 1.35rem; }
.form { display: grid; gap: 10px; }
.form .row2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .form .row2 { grid-template-columns: 1fr; } }
.teams { display: grid; gap: 10px; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
.teams .vs { align-self: center; font-weight: 800; color: var(--muted); }
@media (max-width: 560px) { .teams { grid-template-columns: 1fr; } .teams .vs { justify-self: center; } }
.team { border: 1px solid var(--line); border-radius: var(--t-radius); padding: 10px 12px; background: var(--bg); }
.team.mine { border-color: var(--t-highlight); }
.team .tn { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.team ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.team li { display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; }
.team li .w { color: var(--muted); font-size: .85rem; text-align: right; }
.team li.you { font-weight: 800; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.stations { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.st { display: grid; gap: 10px; align-content: start; }
.st header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.st header h3 { margin: 0; font-size: 1.1rem; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices .btn[aria-pressed="true"] { background: var(--t-highlight); border-color: var(--t-highlight); color: var(--t-highlight-ink); }
ol.line { margin: 0; padding-left: 1.6em; display: grid; gap: 4px; }
ol.line li.you { font-weight: 800; color: var(--t-highlight); }
ol.line .w { color: var(--muted); font-size: .88rem; }
.closed { text-align: center; padding: 30px 16px; }
.closed h2 { margin: 10px 0 6px; font-size: 2rem; color: var(--t-highlight); }
.how { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: .92rem; display: grid; gap: 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row"><h1 id="title">Pickup games<small id="sub"></small></h1></div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-tab="play">Play</button>
      <button data-tab="stations">Stations</button>
      <button data-tab="standings">Standings</button>
      <button data-tab="staff" hidden>Staff</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>
<datalist id="weapons">
  <option value="Shooter"><option value="Roller"><option value="Charger"><option value="Slosher"><option value="Splatling">
  <option value="Dualies"><option value="Brella"><option value="Blaster"><option value="Brush"><option value="Stringer"><option value="Splatana">
</datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shared/ops.js"></script>
<script src="/shared/scrims.js"></script>
<script src="/nav.js"></script>
<script src="/shared/onstream.js"></script>
<script src="/pickup/app.js"></script>
</body>
</html>
