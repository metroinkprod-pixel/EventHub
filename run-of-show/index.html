<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run of show</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link rel="stylesheet" href="/theme.css">
<script src="/site-config.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/shared/ops.css">
<style>
.clock { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.now-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.preview { display: flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.card.live { border-color: var(--live); box-shadow: inset 4px 0 0 var(--live); }
.card.late { border-color: var(--danger); box-shadow: inset 4px 0 0 var(--danger); }
.card .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; }
.card .task { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
.card .who { font-size: .9rem; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.prog { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--live); }
.who-now { display: grid; gap: 4px; grid-template-columns: max-content 1fr; column-gap: 14px; font-size: .95rem; }
.who-now dt { font-weight: 700; }
.who-now dd { margin: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: grid; grid-template-columns: auto 8.6rem 1fr auto; gap: 10px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--line); }
.list > li.live { background: var(--live-bg); }
.list > li.done .task { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); }
.list > li.skipped .task { color: var(--muted); }
.list .time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; padding-top: 1px; }
.list .task { font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.list .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: .88rem; }
.list .notes { font-size: .86rem; color: var(--muted); margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.owner-txt.needs { color: var(--flag); font-weight: 700; }
.chk { width: 22px; height: 22px; accent-color: var(--done); margin: 1px 0 0; cursor: pointer; }
.hour { padding: 8px 16px; background: var(--bg); font-weight: 700; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); }
li.editing { display: block !important; background: var(--live-bg); }
.editor { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.editor .wide { grid-column: 1 / -1; }
.editor .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.editor .acts .danger { margin-left: auto; }
.addrow { display: grid; gap: 8px; grid-template-columns: 7.5rem 7.5rem 1fr 10rem auto; padding: 12px 16px; border-top: 1px solid var(--line); align-items: end; }
.mapgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.prevtable td { font-size: .85rem; }
@media (max-width: 700px) {
  .list > li { grid-template-columns: auto 1fr auto; }
  .list .time { grid-column: 2; }
  .list .body { grid-column: 1 / -1; grid-row: 2; padding-left: 32px; }
  .addrow { grid-template-columns: 1fr 1fr; }
  .addrow .task-in, .addrow button { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1 id="title">Run of show</h1>
      <div class="bar"><button class="lock" id="lockBtn"></button><span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-tab="now">Now</button>
      <button data-tab="timeline">Timeline</button>
      <button data-tab="mine">My shifts</button>
      <button data-tab="tools">Tools</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shared/ops.js"></script>
<script src="/nav.js"></script>
<script src="/run-of-show/app.js"></script>
</body>
</html>
